<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6A1B9A" opacity="0.75"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00838F" opacity="0.75"/>
    </marker>
    <filter id="cardShadow" x="-2%" y="-2%" width="104%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1120" height="620" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="560" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">
    G12: Neural Network Architectures — Network A (65 Params) &amp; Network B (257 Params)
  </text>
  <text x="560" y="56" text-anchor="middle" font-size="12.5" fill="#555566">
    Identical 6 scaled inputs, ReLU hidden activations, Sigmoid output (P(Villain) ≥ 0.5 → Villain [1]), Adam (lr = 0.001), Binary Cross-Entropy
  </text>

  <!-- ==================== NETWORK A CARD ==================== -->
  <rect x="28" y="76" width="1064" height="240" rx="12" fill="#FAF7FC" stroke="#6A1B9A" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="28" y="76" width="1064" height="36" rx="12" fill="#6A1B9A"/>
  <rect x="28" y="98" width="1064" height="14" fill="#6A1B9A"/>
  <text x="48" y="100" font-size="14.5" font-weight="700" fill="#FFFFFF">
    Network A — Basic MLP (1 Hidden Layer)
  </text>
  <text x="1072" y="100" text-anchor="end" font-size="13.5" font-weight="700" fill="#FFFFFF">
    Total Trainable Parameters: 65
  </text>

  <!-- Network A Connections -->
  <g stroke="#6A1B9A" stroke-width="1.1" opacity="0.22">
    <!-- Input (6) to Hidden (8) -->
    <line x1="200" y1="145" x2="500" y2="132"/><line x1="200" y1="145" x2="500" y2="154"/><line x1="200" y1="145" x2="500" y2="176"/><line x1="200" y1="145" x2="500" y2="198"/><line x1="200" y1="145" x2="500" y2="220"/><line x1="200" y1="145" x2="500" y2="242"/><line x1="200" y1="145" x2="500" y2="264"/><line x1="200" y1="145" x2="500" y2="286"/>
    <line x1="200" y1="171" x2="500" y2="132"/><line x1="200" y1="171" x2="500" y2="154"/><line x1="200" y1="171" x2="500" y2="176"/><line x1="200" y1="171" x2="500" y2="198"/><line x1="200" y1="171" x2="500" y2="220"/><line x1="200" y1="171" x2="500" y2="242"/><line x1="200" y1="171" x2="500" y2="264"/><line x1="200" y1="171" x2="500" y2="286"/>
    <line x1="200" y1="197" x2="500" y2="132"/><line x1="200" y1="197" x2="500" y2="154"/><line x1="200" y1="197" x2="500" y2="176"/><line x1="200" y1="197" x2="500" y2="198"/><line x1="200" y1="197" x2="500" y2="220"/><line x1="200" y1="197" x2="500" y2="242"/><line x1="200" y1="197" x2="500" y2="264"/><line x1="200" y1="197" x2="500" y2="286"/>
    <line x1="200" y1="223" x2="500" y2="132"/><line x1="200" y1="223" x2="500" y2="154"/><line x1="200" y1="223" x2="500" y2="176"/><line x1="200" y1="223" x2="500" y2="198"/><line x1="200" y1="223" x2="500" y2="220"/><line x1="200" y1="223" x2="500" y2="242"/><line x1="200" y1="223" x2="500" y2="264"/><line x1="200" y1="223" x2="500" y2="286"/>
    <line x1="200" y1="249" x2="500" y2="132"/><line x1="200" y1="249" x2="500" y2="154"/><line x1="200" y1="249" x2="500" y2="176"/><line x1="200" y1="249" x2="500" y2="198"/><line x1="200" y1="249" x2="500" y2="220"/><line x1="200" y1="249" x2="500" y2="242"/><line x1="200" y1="249" x2="500" y2="264"/><line x1="200" y1="249" x2="500" y2="286"/>
    <line x1="200" y1="275" x2="500" y2="132"/><line x1="200" y1="275" x2="500" y2="154"/><line x1="200" y1="275" x2="500" y2="176"/><line x1="200" y1="275" x2="500" y2="198"/><line x1="200" y1="275" x2="500" y2="220"/><line x1="200" y1="275" x2="500" y2="242"/><line x1="200" y1="275" x2="500" y2="264"/><line x1="200" y1="275" x2="500" y2="286"/>
    <!-- Hidden (8) to Output (1) -->
    <line x1="500" y1="132" x2="820" y2="210" opacity="0.45"/><line x1="500" y1="154" x2="820" y2="210" opacity="0.45"/>
    <line x1="500" y1="176" x2="820" y2="210" opacity="0.45"/><line x1="500" y1="198" x2="820" y2="210" opacity="0.45"/>
    <line x1="500" y1="220" x2="820" y2="210" opacity="0.45"/><line x1="500" y1="242" x2="820" y2="210" opacity="0.45"/>
    <line x1="500" y1="264" x2="820" y2="210" opacity="0.45"/><line x1="500" y1="286" x2="820" y2="210" opacity="0.45"/>
  </g>

  <!-- Network A Input Nodes (6) -->
  <g font-size="11" fill="#222233" text-anchor="end">
    <text x="182" y="149">intelligence_score</text>
    <text x="182" y="175">strength_score</text>
    <text x="182" y="201">speed_score</text>
    <text x="182" y="227">durability_score</text>
    <text x="182" y="253">power_score</text>
    <text x="182" y="279">combat_score</text>
  </g>
  <g fill="#EDE7F6" stroke="#6A1B9A" stroke-width="1.8">
    <circle cx="200" cy="145" r="8"/><circle cx="200" cy="171" r="8"/><circle cx="200" cy="197" r="8"/>
    <circle cx="200" cy="223" r="8"/><circle cx="200" cy="249" r="8"/><circle cx="200" cy="275" r="8"/>
  </g>
  <text x="200" y="305" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A148C">Input Layer (6)</text>

  <!-- Network A Param Pill 1 -->
  <rect x="295" y="196" width="112" height="26" rx="13" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.2"/>
  <text x="351" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#6A1B9A">6×8 + 8 = 56</text>

  <!-- Network A Hidden Layer (8 ReLU) -->
  <g fill="#6A1B9A" stroke="#4A148C" stroke-width="1.5">
    <circle cx="500" cy="132" r="8"/><circle cx="500" cy="154" r="8"/><circle cx="500" cy="176" r="8"/><circle cx="500" cy="198" r="8"/>
    <circle cx="500" cy="220" r="8"/><circle cx="500" cy="242" r="8"/><circle cx="500" cy="264" r="8"/><circle cx="500" cy="286" r="8"/>
  </g>
  <text x="500" y="308" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A148C">Dense(8, ReLU)</text>

  <!-- Network A Param Pill 2 -->
  <rect x="612" y="196" width="102" height="26" rx="13" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.2"/>
  <text x="663" y="213" text-anchor="middle" font-size="11" font-weight="700" fill="#6A1B9A">8×1 + 1 = 9</text>

  <!-- Network A Output Node (1 Sigmoid) -->
  <circle cx="820" cy="210" r="14" fill="#6A1B9A" stroke="#4A148C" stroke-width="2"/>
  <text x="820" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">σ</text>
  <text x="820" y="246" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4A148C">Dense(1, Sigmoid)</text>

  <!-- Arrow to Prediction -->
  <line x1="840" y1="210" x2="892" y2="210" stroke="#6A1B9A" stroke-width="2" marker-end="url(#arrowA)"/>
  <rect x="900" y="179" width="168" height="62" rx="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.4"/>
  <text x="984" y="199" text-anchor="middle" font-size="11.5" font-weight="700" fill="#222233">Output: P(Villain)</text>
  <text x="984" y="216" text-anchor="middle" font-size="11" fill="#D62839" font-weight="600">≥ 0.5 → Villain (1)</text>
  <text x="984" y="232" text-anchor="middle" font-size="11" fill="#1F5FBF" font-weight="600">&lt; 0.5 → Hero (0)</text>

  <!-- ==================== NETWORK B CARD ==================== -->
  <rect x="28" y="338" width="1064" height="264" rx="12" fill="#F4FAFA" stroke="#00838F" stroke-width="2" filter="url(#cardShadow)"/>
  <rect x="28" y="338" width="1064" height="36" rx="12" fill="#00838F"/>
  <rect x="28" y="360" width="1064" height="14" fill="#00838F"/>
  <text x="48" y="362" font-size="14.5" font-weight="700" fill="#FFFFFF">
    Network B — Deeper MLP (2 Hidden Layers)
  </text>
  <text x="1072" y="362" text-anchor="end" font-size="13.5" font-weight="700" fill="#FFFFFF">
    Total Trainable Parameters: 257
  </text>

  <!-- Network B Connections (representative dense bundle) -->
  <g stroke="#00838F" stroke-width="1" opacity="0.22">
    <!-- Input (6) to Hidden1 (16: shown as top 6 + ellipsis + bottom 6 or compact 16 dots) -->
    <!-- Let's draw all 16 nodes compactly spaced by 11px: y from 396 to 561 -->
    <line x1="200" y1="414" x2="420" y2="396"/><line x1="200" y1="414" x2="420" y2="440"/><line x1="200" y1="414" x2="420" y2="484"/><line x1="200" y1="414" x2="420" y2="528"/><line x1="200" y1="414" x2="420" y2="561"/>
    <line x1="200" y1="440" x2="420" y2="396"/><line x1="200" y1="440" x2="420" y2="440"/><line x1="200" y1="440" x2="420" y2="484"/><line x1="200" y1="440" x2="420" y2="528"/><line x1="200" y1="440" x2="420" y2="561"/>
    <line x1="200" y1="466" x2="420" y2="396"/><line x1="200" y1="466" x2="420" y2="440"/><line x1="200" y1="466" x2="420" y2="484"/><line x1="200" y1="466" x2="420" y2="528"/><line x1="200" y1="466" x2="420" y2="561"/>
    <line x1="200" y1="492" x2="420" y2="396"/><line x1="200" y1="492" x2="420" y2="440"/><line x1="200" y1="492" x2="420" y2="484"/><line x1="200" y1="492" x2="420" y2="528"/><line x1="200" y1="492" x2="420" y2="561"/>
    <line x1="200" y1="518" x2="420" y2="396"/><line x1="200" y1="518" x2="420" y2="440"/><line x1="200" y1="518" x2="420" y2="484"/><line x1="200" y1="518" x2="420" y2="528"/><line x1="200" y1="518" x2="420" y2="561"/>
    <line x1="200" y1="544" x2="420" y2="396"/><line x1="200" y1="544" x2="420" y2="440"/><line x1="200" y1="544" x2="420" y2="484"/><line x1="200" y1="544" x2="420" y2="528"/><line x1="200" y1="544" x2="420" y2="561"/>

    <!-- Hidden1 (16) to Hidden2 (8) -->
    <line x1="420" y1="396" x2="640" y2="404"/><line x1="420" y1="396" x2="640" y2="448"/><line x1="420" y1="396" x2="640" y2="492"/><line x1="420" y1="396" x2="640" y2="558"/>
    <line x1="420" y1="440" x2="640" y2="404"/><line x1="420" y1="440" x2="640" y2="448"/><line x1="420" y1="440" x2="640" y2="492"/><line x1="420" y1="440" x2="640" y2="558"/>
    <line x1="420" y1="484" x2="640" y2="404"/><line x1="420" y1="484" x2="640" y2="448"/><line x1="420" y1="484" x2="640" y2="492"/><line x1="420" y1="484" x2="640" y2="558"/>
    <line x1="420" y1="528" x2="640" y2="404"/><line x1="420" y1="528" x2="640" y2="448"/><line x1="420" y1="528" x2="640" y2="492"/><line x1="420" y1="528" x2="640" y2="558"/>
    <line x1="420" y1="561" x2="640" y2="404"/><line x1="420" y1="561" x2="640" y2="448"/><line x1="420" y1="561" x2="640" y2="492"/><line x1="420" y1="561" x2="640" y2="558"/>

    <!-- Hidden2 (8) to Output (1) -->
    <line x1="640" y1="404" x2="820" y2="478" opacity="0.5"/><line x1="640" y1="426" x2="820" y2="478" opacity="0.5"/>
    <line x1="640" y1="448" x2="820" y2="478" opacity="0.5"/><line x1="640" y1="470" x2="820" y2="478" opacity="0.5"/>
    <line x1="640" y1="492" x2="820" y2="478" opacity="0.5"/><line x1="640" y1="514" x2="820" y2="478" opacity="0.5"/>
    <line x1="640" y1="536" x2="820" y2="478" opacity="0.5"/><line x1="640" y1="558" x2="820" y2="478" opacity="0.5"/>
  </g>

  <!-- Network B Input Nodes (6) -->
  <g font-size="11" fill="#222233" text-anchor="end">
    <text x="182" y="418">intelligence_score</text>
    <text x="182" y="444">strength_score</text>
    <text x="182" y="470">speed_score</text>
    <text x="182" y="496">durability_score</text>
    <text x="182" y="522">power_score</text>
    <text x="182" y="548">combat_score</text>
  </g>
  <g fill="#E0F7FA" stroke="#00838F" stroke-width="1.8">
    <circle cx="200" cy="414" r="8"/><circle cx="200" cy="440" r="8"/><circle cx="200" cy="466" r="8"/>
    <circle cx="200" cy="492" r="8"/><circle cx="200" cy="518" r="8"/><circle cx="200" cy="544" r="8"/>
  </g>
  <text x="200" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#006064">Input Layer (6)</text>

  <!-- Network B Param Pill 1 -->
  <rect x="252" y="465" width="120" height="26" rx="13" fill="#FFFFFF" stroke="#00838F" stroke-width="1.2"/>
  <text x="312" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">6×16 + 16 = 112</text>

  <!-- Network B Hidden Layer 1 (16 ReLU) -->
  <g fill="#00838F" stroke="#006064" stroke-width="1.2">
    <circle cx="420" cy="396" r="4.5"/><circle cx="420" cy="407" r="4.5"/><circle cx="420" cy="418" r="4.5"/><circle cx="420" cy="429" r="4.5"/>
    <circle cx="420" cy="440" r="4.5"/><circle cx="420" cy="451" r="4.5"/><circle cx="420" cy="462" r="4.5"/><circle cx="420" cy="473" r="4.5"/>
    <circle cx="420" cy="484" r="4.5"/><circle cx="420" cy="495" r="4.5"/><circle cx="420" cy="506" r="4.5"/><circle cx="420" cy="517" r="4.5"/>
    <circle cx="420" cy="528" r="4.5"/><circle cx="420" cy="539" r="4.5"/><circle cx="420" cy="550" r="4.5"/><circle cx="420" cy="561" r="4.5"/>
  </g>
  <text x="420" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#006064">Dense(16, ReLU)</text>

  <!-- Network B Param Pill 2 -->
  <rect x="468" y="465" width="124" height="26" rx="13" fill="#FFFFFF" stroke="#00838F" stroke-width="1.2"/>
  <text x="530" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">16×8 + 8 = 136</text>

  <!-- Network B Hidden Layer 2 (8 ReLU) -->
  <g fill="#00838F" stroke="#006064" stroke-width="1.5">
    <circle cx="640" cy="404" r="7.5"/><circle cx="640" cy="426" r="7.5"/><circle cx="640" cy="448" r="7.5"/><circle cx="640" cy="470" r="7.5"/>
    <circle cx="640" cy="492" r="7.5"/><circle cx="640" cy="514" r="7.5"/><circle cx="640" cy="536" r="7.5"/><circle cx="640" cy="558" r="7.5"/>
  </g>
  <text x="640" y="584" text-anchor="middle" font-size="11.5" font-weight="700" fill="#006064">Dense(8, ReLU)</text>

  <!-- Network B Param Pill 3 -->
  <rect x="684" y="465" width="96" height="26" rx="13" fill="#FFFFFF" stroke="#00838F" stroke-width="1.2"/>
  <text x="732" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">8×1 + 1 = 9</text>

  <!-- Network B Output Node (1 Sigmoid) -->
  <circle cx="820" cy="478" r="14" fill="#00838F" stroke="#006064" stroke-width="2"/>
  <text x="820" y="482" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">σ</text>
  <text x="820" y="514" text-anchor="middle" font-size="11.5" font-weight="700" fill="#006064">Dense(1, Sigmoid)</text>

  <!-- Arrow to Prediction -->
  <line x1="840" y1="478" x2="892" y2="478" stroke="#00838F" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="900" y="447" width="168" height="62" rx="8" fill="#FFFFFF" stroke="#00838F" stroke-width="1.4"/>
  <text x="984" y="467" text-anchor="middle" font-size="11.5" font-weight="700" fill="#222233">Output: P(Villain)</text>
  <text x="984" y="484" text-anchor="middle" font-size="11" fill="#D62839" font-weight="600">≥ 0.5 → Villain (1)</text>
  <text x="984" y="500" text-anchor="middle" font-size="11" fill="#1F5FBF" font-weight="600">&lt; 0.5 → Hero (0)</text>
</svg>
